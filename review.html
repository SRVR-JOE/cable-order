<!doctype html>

<head>

<title>Cable Order — Test Labels</title>
<style>
  :root { --ink:#1d1630; --muted:#5b5470; --line:#e6e1f2; --bg:#ffffff; }

  h1 { font-size:26px; margin:0 0 8px; } .muted { color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:24px; margin-top:24px; }
  figure { margin:0; border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center; background:#fff; }

  figcaption { font:600 15px ui-monospace, Menlo, monospace; color:#1d1630; margin-top:6px; }

<main>
